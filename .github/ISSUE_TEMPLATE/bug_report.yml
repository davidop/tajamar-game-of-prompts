name: Bug report
description: Report a reproducible problem in an app, test, dashboard or documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: ["GSD Core", "Spec Kit", "Dashboard", "Shared tests", "Documentation", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include commands, environment and expected vs actual behavior
      placeholder: "1. Run ...\n2. Click ...\nExpected ...\nActual ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots and test evidence
      description: Remove secrets and personal data before sharing
