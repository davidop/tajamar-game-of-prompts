name: Publish comparison dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'assets/screenshots/**'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-dashboard
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Include verified Playwright screenshots in published site
        run: |
          mkdir -p dashboard/screenshots
          cp assets/screenshots/gsd-core.png dashboard/screenshots/gsd-core.png
          cp assets/screenshots/spec-kit.png dashboard/screenshots/spec-kit.png
          test -s dashboard/screenshots/gsd-core.png
          test -s dashboard/screenshots/spec-kit.png
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
